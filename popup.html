<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mod Headers</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <h1>Mod Headers</h1>
  <div id="headerRows"></div>

  <template id="header-row-template">
    <div class="header-wrapper">
      <span class="header-title"></span>
      <input type="checkbox" />
      <div class="param-container">
        <input type="text" placeholder="X-Header-Name" class="paramInput" />
        <input type="text" placeholder="value" class="paramInput param-value" />
        <button class="param-action param-action-url"
          title="Copy this tab's URL with the header added as a query param"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 9.5a2.5 2.5 0 0 0 3.54 0l2.5-2.5a2.5 2.5 0 0 0-3.54-3.54l-.9.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9.5 6.5a2.5 2.5 0 0 0-3.54 0l-2.5 2.5a2.5 2.5 0 0 0 3.54 3.54l.9-.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="param-action param-action-delete" title="Delete this row"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 4.5h9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6 4.5V3.3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 4.5l.6 8.3a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 1-.9l.6-8.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.7 7v4M9.3 7v4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </template>

  <div class="add-row-wrapper">
    <button class="param-action param-action-add" id="addHeaderRow" title="Add a new header row"
      aria-label="Add a new header row"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
  </div>

  <footer class="legend">
    <div class="legend-servo">
      <button class="param-action param-action-servo servo-open" id="servoOpen"
        title="Open this tab's stack in Servo (reads the servo-context meta tag, or falls back to the URL)">Open on
        Servo</button>
      <span>Reads the page's <code>servo-context</code>, else <code>pr-&lt;number&gt;</code> from the URL</span>
    </div>
    <dl class="legend-keys">
      <dt class="legend-key"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6.5 9.5a2.5 2.5 0 0 0 3.54 0l2.5-2.5a2.5 2.5 0 0 0-3.54-3.54l-.9.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M9.5 6.5a2.5 2.5 0 0 0-3.54 0l-2.5 2.5a2.5 2.5 0 0 0 3.54 3.54l.9-.9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></dt>
      <dd>Copy this tab's URL with the header added as a query param</dd>
    </dl>
    <p class="legend-shortcuts">
      <kbd>1</kbd>–<kbd>9</kbd> toggle a row (first nine only) · <kbd>Ctrl</kbd>+<kbd>1</kbd>–<kbd>9</kbd> select the header name ·
      <kbd>Shift</kbd>+<kbd>1</kbd>–<kbd>9</kbd> select the value · <kbd>Esc</kbd> leave a field
    </p>
  </footer>

  <script src="/dist/popup.js" defer></script>
</body>

</html>
